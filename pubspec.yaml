name: texterr
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  
  # Database
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # Crypto & Security
  libsignal_protocol_dart: ^0.7.4
  flutter_secure_storage: ^10.0.0-beta.4
  crypto: ^3.0.3
  
  # WebRTC
  flutter_webrtc: ^1.2.0
  
  # HTTP & WebSocket
  http: ^1.2.0
  web_socket_channel: ^3.0.3
  
  # Media & Files
  image_picker: ^1.0.7
  file_picker: ^10.3.3
  image: ^4.1.7
  video_compress: ^3.1.2
  flutter_image_compress: ^2.1.0
  permission_handler: ^12.0.1
  
  # UI
  intl: ^0.20.2
  uuid: ^4.3.3
  emoji_picker_flutter: ^4.3.0
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0
  url_launcher: ^6.3.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.16.0
  riverpod_generator: ^3.0.3
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#00A884"
    theme_color: "#00A884"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"
  linux:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    
